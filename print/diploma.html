<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Reunion Hackathon · certyfikaty</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600..900&family=Barlow+Condensed:wght@100;300&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="print.css">
<style>
  /* A4 landscape, 4 px per mm (1188 x 840) */
  body { background: #EDE8E0; }
  .wall { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; width: 2500px; }
  .cert { width: 1188px; height: 840px; position: relative; overflow: hidden; flex: none; background: var(--white); color: var(--ink); }
  .cert.red { background: var(--red); color: #fff; }
  .cert .frame { position: absolute; inset: 28px; border: 2px solid var(--red); }
  .cert.red .frame { border-color: rgba(255,255,255,.55); }
  .cert .hd { position: absolute; left: 70px; right: 70px; top: 64px; display: flex; justify-content: space-between; align-items: center; font: 600 15px "IBM Plex Mono"; letter-spacing: .18em; text-transform: uppercase; color: var(--red); }
  .cert.red .hd { color: #fff; }
  .cert .hd .lockup { font-size: 22px; color: var(--ink); }
  .cert.red .hd .lockup { color: #fff; }
  .cert .kind { position: absolute; left: 70px; top: 150px; font: 400 64px/1 "Instrument Serif"; }
  .cert .kind em { font-style: italic; color: var(--red); } .cert.red .kind em { color: #fff; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 8px; }
  /* name + text flow in one column that stops before the route, so long names wrap instead of hitting it */
  .cert .col { position: absolute; left: 70px; top: 250px; width: 590px; }
  .cert .who dt { font: 500 13px "IBM Plex Mono"; letter-spacing: .2em; text-transform: uppercase; opacity: .65; }
  .cert .who dd { font: 900 96px/.9 "Big Shoulders Display"; text-transform: uppercase; margin-top: 10px; }
  .cert .who dd.tpl { opacity: .3; }
  .cert .why { margin-top: 44px; font: 400 21px/1.5 "IBM Plex Mono"; }
  .cert .route { position: absolute; right: 70px; top: 250px; width: 420px; text-align: right; white-space: nowrap; }
  .cert .route .iata { font: 900 84px/.8 "Big Shoulders Display"; }
  .cert .route .iata b { color: var(--red); } .cert.red .route .iata b { color: #fff; text-shadow: 4px 6px 0 rgba(109,6,19,.45); }
  .cert .route svg { width: 100%; height: 90px; overflow: visible; margin: 10px 0; }
  .cert .route .mono { font-size: 12px; opacity: .7; }
  .cert .place { position: absolute; right: 70px; top: 380px; text-align: right; }
  .cert .place b { font: 100 230px/.8 "Barlow Condensed"; letter-spacing: -.02em; }
  .cert .sig { position: absolute; left: 70px; right: 70px; bottom: 70px; display: grid; grid-template-columns: 1fr 1fr auto; gap: 60px; align-items: end; }
  .cert .sig div { border-top: 2px solid currentColor; padding-top: 10px; font: 600 13px "IBM Plex Mono"; letter-spacing: .12em; text-transform: uppercase; }
  .cert .sig span { display: block; font-weight: 500; opacity: .65; margin-top: 4px; letter-spacing: .08em; text-transform: none; }
  .cert .sig img { width: 92px; height: 92px; }
  .cert .g { position: absolute; right: -260px; bottom: -520px; width: 900px; height: 900px; opacity: .12; } .cert .g svg { width: 100%; height: 100%; }
</style></head><body>
<div class="wall" id="wall"></div>
<script src="print.js"></script>
<script>
  const route = (col) => `<div class="iata">LHR <b>→ WAW</b></div><svg viewBox="0 0 380 90"><path d="M10 80 Q190 -20 370 80" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="8 8"/>${Print.swallow(200, 32, 10, .3, col === "#fff" ? "#fff" : "#C8102E")}</svg><p class="mono">Londyn → Warszawa · 05.02.2027</p>`;
  const cert = (red) => `
    <section class="cert ${red ? "red grain" : ""}" data-shot="${red ? "certyfikat-zwyciezca" : "certyfikat-uczestnik"}">
      <div class="frame"></div>
      <div class="g">${Print.globe({ op: 1, width: 5, arcs: false, stroke: red ? "#fff" : "#C8102E" })}</div>
      <div class="hd"><span class="lockup">${red ? Print.mark() : Print.mark("#141210", "#C8102E")}Reunion Hackathon<span class="by">${Print.gpss(red ? "white" : "red")}</span></span><span>Certyfikat · Edycja 01</span></div>
      <p class="kind">${red ? "Zwycięski <em>zespół.</em>" : "Certyfikat <em>uczestnictwa.</em>"}</p>
      <div class="col"><dl class="who"><dt>${red ? "Zespół" : "Pasażer"}</dt><dd class="tpl">${red ? "Nazwa zespołu" : "Imię Nazwisko"}</dd></dl>
      <p class="why">${red ? "Pierwsze miejsce w&nbsp;ścieżce partnerskiej. 48&nbsp;godzin pracy nad wyzwaniem z&nbsp;obszaru transformacji&nbsp;AI." : "Za udział w&nbsp;Reunion Hackathon: 48&nbsp;godzin pracy nad realnym wyzwaniem z&nbsp;obszaru transformacji&nbsp;AI."}<br><br>Warszawa, 5–7 lutego 2027.</p></div>
      ${red ? `<div class="place"><b>01</b><p class="mono">Miejsce · ścieżka partnerska</p></div>` : `<div class="route">${route("#C8102E")}</div>`}
      <div class="sig"><div>Adam Bączek<span>Lead, Reunion Hackathon</span></div><div>Global Polish Student Society<span>Organizator</span></div><span class="mono" style="font-size:13px">return(home);</span></div>
    </section>`;
  document.getElementById("wall").innerHTML = cert(false) + cert(true);
</script>
</body></html>
