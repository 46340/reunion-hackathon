<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Reunion Hackathon · materiały</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600..900&family=Barlow+Condensed:wght@100;300&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="print.css">
<style>
  /* the print kit as one A4 landscape PDF; every item is a 2x render from out/ (node render.mjs ...) */
  @page { size: 297mm 210mm; margin: 0; }
  body { background: #777; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pg { width: 1123px; height: 794px; position: relative; overflow: hidden; background: var(--paper, #F1ECE3); color: var(--ink); page-break-after: always; margin: 0 auto 20px; }
  @media print { body { background: none; } .pg { margin: 0; } }
  .pg header { position: absolute; left: 44px; right: 44px; top: 30px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 10px; font: 500 10px "IBM Plex Mono"; letter-spacing: .18em; text-transform: uppercase; }
  .pg header b { color: var(--red); font-weight: 600; }
  .pg h2 { position: absolute; left: 44px; top: 66px; font: 900 44px/1 "Big Shoulders Display"; text-transform: uppercase; }
  .pg h2 em { font-style: normal; color: var(--red); }
  .pg .stage { position: absolute; left: 44px; top: 130px; right: 330px; bottom: 44px; display: flex; gap: 22px; align-items: center; justify-content: center; }
  .pg .stage img { max-height: 100%; max-width: 100%; object-fit: contain; filter: drop-shadow(0 14px 22px rgba(20,16,10,.22)); min-width: 0; }
  .pg .stage.col { flex-direction: column; }
  .pg aside { position: absolute; right: 44px; top: 130px; width: 262px; bottom: 44px; display: flex; flex-direction: column; gap: 14px; font: 400 11.5px/1.55 "IBM Plex Mono"; }
  .pg aside p { padding-left: 26px; position: relative; } .pg aside p b { font-weight: 600; }
  .pg aside p::before { content: ""; position: absolute; left: 0; top: 7px; width: 14px; height: 2px; background: var(--red); }
  .pg aside .spec { margin-top: auto; border-top: 2px solid var(--ink); padding-top: 10px; display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 10.5px; }
  .pg aside .spec dt { color: rgba(20,18,16,.6); text-transform: uppercase; letter-spacing: .1em; font-size: 9.5px; padding-top: 1px; }
  .cover { background: var(--red); color: #fff; }
  .cover .g { position: absolute; left: -60px; right: -60px; top: 400px; height: 1250px; opacity: .18; } .cover .g svg { width: 100%; height: 100%; }
  .cover .lockup { position: absolute; left: 50px; top: 40px; font-size: 18px; }
  .cover .tag { position: absolute; right: 50px; top: 46px; font: 600 11px "IBM Plex Mono"; letter-spacing: .2em; text-transform: uppercase; }
  .cover .blk { position: absolute; left: 0; right: 0; top: 130px; text-align: center; }
  .cover .kind { position: absolute; left: 0; right: 0; top: 410px; text-align: center; font: 400 54px/1 "Instrument Serif"; }
  .cover .kind em { font-style: italic; }
  .cover .toc { position: absolute; left: 50px; right: 50px; bottom: 44px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px 24px; font: 600 10.5px "IBM Plex Mono"; letter-spacing: .14em; text-transform: uppercase; border-top: 1px solid rgba(255,255,255,.5); padding-top: 14px; }
  .cover .toc span i { font-style: normal; opacity: .6; margin-right: 8px; }
  .sw { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw div { height: 120px; padding: 10px; display: flex; flex-direction: column; justify-content: flex-end; font: 600 10px "IBM Plex Mono"; letter-spacing: .1em; }
  .type { display: grid; gap: 10px; margin-top: 18px; }
  .type div { display: grid; grid-template-columns: 1fr auto; align-items: baseline; border-top: 1px solid rgba(20,18,16,.18); padding-top: 8px; }
  .type span { font: 500 10px "IBM Plex Mono"; letter-spacing: .1em; color: rgba(20,18,16,.6); text-transform: uppercase; }
  .lk { display: flex; gap: 18px; align-items: center; }
  .lk > div { padding: 22px 26px; }
</style></head><body>
<div id="deck"></div>
<script src="print.js"></script>
<script>
  const img = (n, st = "") => `<img src="out/${n}.png" alt="" style="${st}">`;
  const notes = (arr, spec) => `<aside>${arr.map((t) => `<p>${t}</p>`).join("")}<dl class="spec">${spec.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></aside>`;
  let n = 0;
  const page = (title, stage, aside, cls = "") => { n++; return `<section class="pg"><header><span>Reunion Hackathon · materiały · Edycja 01</span><b>${String(n).padStart(2, "0")} · ${title.replace(/<[^>]+>/g, "")}</b></header><h2>${title}</h2><div class="stage ${cls}">${stage}</div>${aside}</section>`; };

  const pages = [];
  n++;
  pages.push(`<section class="pg cover grain"><div class="g">${Print.globe({ op: 1, width: 6, arcs: false })}</div>
    <span class="lockup">${Print.mark()}Reunion Hackathon<span class="by">${Print.gpss("white")}</span></span><span class="tag">Warszawa · 5–7 lutego 2027</span>
    <div class="blk"><div class="block" id="cb">REUNION</div></div>
    <p class="kind">Bilety, plakaty, roll-up, koszulki <em>i cała reszta.</em></p>
    <div class="toc">${[[2, "Znak i kolory"], [3, "Bilet"], [4, "Plakaty"], [5, "Roll-up"], [6, "Koszulki"], [8, "Identyfikatory"], [9, "Smycze"], [10, "Naklejki"], [11, "Social media"], [13, "Oznakowanie sali"], [14, "Certyfikaty"], [15, "Specyfikacja"]].map(([p, t]) => `<span><i>${String(p).padStart(2, "0")}</i>${t}</span>`).join("")}</div></section>`);

  pages.push(page("Znak i <em>kolory.</em>",
    `<div style="width:100%;display:grid;gap:22px">
      <div class="lk"><div style="background:var(--red);color:#fff"><span class="lockup" style="font-size:26px">${Print.mark()}Reunion Hackathon<span class="by">${Print.gpss("white")}</span></span></div>
        <div style="background:#fff"><span class="lockup" style="font-size:26px;color:var(--ink)">${Print.mark("#141210", "#C8102E")}Reunion Hackathon<span class="by">${Print.gpss("red")}</span></span></div></div>
      <div class="sw"><div style="background:#C8102E;color:#fff">CZERWIEŃ<br>#C8102E</div><div style="background:#FBF9F5;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)">BIEL<br>#FBF9F5</div><div style="background:#141210;color:#fff">CZERŃ<br>#141210</div><div style="background:#EBC9CC">RÓŻ (EKSTRUZJA)<br>#EBC9CC</div></div>
      <div class="type"><div><b style="font:900 40px/1 'Big Shoulders Display';text-transform:uppercase">Big Shoulders Display 900</b><span>Nagłówki, REUNION</span></div>
        <div><b style="font:100 40px/1 'Barlow Condensed';text-transform:uppercase">Barlow Condensed 100</b><span>Liczby, HACKATHON</span></div>
        <div><b style="font:400 34px/1 'Instrument Serif'">Instrument Serif, <i>akcenty</i></b><span>Hasła</span></div>
        <div><b style="font:500 16px/1 'IBM Plex Mono';letter-spacing:.16em">IBM PLEX MONO · ETYKIETY · return(home);</b><span>Dane, podpisy</span></div></div></div>`,
    notes(["<b>Znak:</b> logo Reunion i obok planeta GPSS, oddzielone cienką kreską. Tak jak na stronie.", "<b>Czerwień i biel</b> to baza. Czerń tylko dla załogi i tablicy przylotów.", "<b>Motywy:</b> jaskółki (Trepkowski), siatka globu, tablica split-flap, return(home);."],
      [["Fonty", "Google Fonts, licencja OFL"], ["Logo GPSS", "globalpolsoc.com, wycięta planeta"]])));

  pages.push(page("Bilet: <em>karta pokładowa.</em>",
    `<div style="display:flex;flex-direction:column;gap:18px;align-items:center;width:100%">${img("bilet-LHR", "width:100%")}<div style="display:flex;gap:18px;height:300px">${img("stories-AMS")}${img("stories-CPH")}</div></div>`,
    notes(["<b>Bilet</b> dostaje każda przyjęta osoba: trasa z miasta uczelni do WAW, numer miejsca z 100.", "<b>Stories 1080×1920:</b> ta sama karta do udostępnienia. Każde miasto wygląda inaczej.", "Kreski to ozdoba, nie kod do skanowania. Bramka = miejsce wydarzenia, uzupełnimy po ogłoszeniu."],
      [["Druk", "203 × 82 mm, karton 300 g"], ["Cyfrowo", "strona zaproszenia + PNG Stories"], ["Dane", "imię, miasto, miejsce z bazy"]])));

  pages.push(page("<em>Plakaty.</em>",
    `${img("plakat-50x70", "height:100%")}${img("plakat-agenda", "height:100%")}`,
    notes(["<b>Plakat 50×70:</b> REUNION, globus, jaskółki wracające do domu, QR do strony.", "<b>Plakat z planem (A2):</b> tablica odlotów z godzinami z harmonogramu. Puste godziny zostają jako --:--.", "Organizator z planetą GPSS w stopce."],
      [["Formaty", "50 × 70 cm, A2"], ["Papier", "kreda mat 170 g"], ["Spad", "3 mm"]])));

  pages.push(page("<em>Roll-up.</em>",
    `${img("rollup-85x200", "height:100%")}`,
    notes(["Ten sam układ co plakat, w pionie 85×200.", "Fakty w ramkach: 100 miejsc, 48 godzin, udział bezpłatny, solo lub zespołowo.", "Dolne 20 cm zostaje puste, bo zasłania je stół."],
      [["Format", "85 × 200 cm"], ["Materiał", "baner PET/PVC, kaseta"], ["Plik", "1:1, 150 dpi"]])));

  pages.push(page("Koszulki <em>uczestników.</em>", `${img("koszulki-uczestnik", "width:100%")}`,
    notes(["<b>Biała:</b> mały REUNION na piersi, na plecach tablica przylotów z 7 krajami.", "<b>Czerwona:</b> REUNION i globus z przodu, 100 · 48H na plecach.", "Jaskółki na każdej koszulce."],
      [["Druk", "sitodruk 1-2 kolory"], ["Kolory", "biel + czerwień Pantone 186 C"]])));

  pages.push(page("Koszulki <em>załogi i mentorów.</em>", `${img("koszulki-zaloga", "width:100%")}`,
    notes(["<b>Załoga</b> w czerni, żeby było ją widać na sali.", "<b>Mentor i jury</b> w bieli z czerwonym napisem.", "Przód ten sam co u uczestników, różni się rękaw i plecy."],
      [["Druk", "sitodruk"], ["Ilość", "do ustalenia"]])));

  pages.push(page("<em>Identyfikatory.</em>",
    `<div style="display:flex;flex-wrap:wrap;gap:18px;justify-content:center;height:100%;align-content:center">${["uczestnik", "zaloga", "mentor", "jury", "partner"].map((r) => img("badge-" + r, "height:300px")).join("")}</div>`,
    notes(["Pięć ról, rozpoznawalnych po kolorze dolnego paska.", "<b>Uczestnik</b> ma miejsce i trasę jak na bilecie.", "Szare pola to szablon, dane wchodzą z bazy zgłoszeń."],
      [["Format", "90 × 130 mm"], ["Materiał", "karton 350 g lub PVC"], ["Otwór", "na klips smyczy"]])));

  pages.push(page("<em>Smycze.</em>",
    `${["red", "ink", "white"].map((c) => img("lanyard-" + c, "width:100%")).join("")}`,
    notes(["<b>Czerwona</b> dla uczestników, <b>czarna</b> dla załogi, <b>biała</b> dla mentorów, jury i partnerów.", "Raport: znak, nazwa, jaskółka, data, planeta GPSS, return(home);."],
      [["Szerokość", "20 mm"], ["Druk", "sublimacja, dwustronnie"], ["Raport", "280 mm"]]), "col"));

  pages.push(page("<em>Naklejki.</em>",
    `<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center">${img("sticker-okragla", "height:150px")}${img("sticker-bagaz", "height:140px")}${img("sticker-kod", "height:110px")}${img("sticker-jaskolka", "height:120px")}${img("sticker-tablica", "height:90px")}${img("sticker-100", "height:170px")}${img("sticker-gpss", "height:150px")}</div>`,
    notes(["Siedem naklejek na laptopa: znak, nalepka bagażowa WAW, return(home);, jaskółka, tablica WAW 27, 100 miejsc, planeta GPSS.", "Nalepka bagażowa nawiązuje do starych etykiet LOT i poczty lotniczej."],
      [["Wykrojnik", "po obrysie, biała obwódka 3 mm"], ["Materiał", "folia winylowa mat"]])));

  pages.push(page("Social <em>media.</em>",
    `${["ig-ogloszenie", "ig-rekrutacja", "ig-partnerzy"].map((s) => img(s, "height:92%")).join("")}`,
    notes(["<b>Ogłoszenie:</b> REUNION i tablica z datą.", "<b>Rekrutacja:</b> 100 miejsc, „Szukamy stu osób”.", "<b>Dla firm:</b> cztery poziomy i kontakt do Maksa Rokosza."],
      [["Instagram", "1080 × 1350"], ["Teksty", "ze strony, bez nowych obietnic"]])));

  pages.push(page("Okładki <em>wydarzenia.</em>",
    `${img("linkedin-cover", "width:100%")}${img("wydarzenie-cover", "width:78%")}`,
    notes(["<b>LinkedIn:</b> lewa część zostaje pusta, tam wchodzi zdjęcie profilowe.", "<b>Wydarzenie</b> na Facebooku i LinkedIn: hasło ze strony i organizator."],
      [["LinkedIn", "1584 × 396"], ["Wydarzenie", "1920 × 1005"]]), "col"));

  pages.push(page("Oznakowanie <em>sali.</em>",
    `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%">${["znak-reg", "znak-hall", "znak-quiet", "znak-food"].map((s) => img(s, "width:100%")).join("")}${img("stol-07", "width:100%")}${img("stol-23", "width:100%")}</div>`,
    notes(["Kierunkowskazy jak na lotnisku: piktogram, jedno słowo, strzałka.", "<b>Numer stanowiska</b> stoi na stole zespołu, nazwę i ścieżkę dopisuje się markerem.", "Strefa ciszy, bo sala działa całą dobę."],
      [["Znaki", "100 × 30 cm, PCV 3 mm"], ["Stanowiska", "A5, namiot z kartonu"]])));

  pages.push(page("<em>Certyfikaty.</em>",
    `<div style="display:flex;flex-direction:column;gap:16px;height:100%;justify-content:center">${img("certyfikat-uczestnik", "height:48%")}${img("certyfikat-zwyciezca", "height:48%")}</div>`,
    notes(["<b>Uczestnictwo:</b> dla każdego, z trasą z miasta uczelni do WAW.", "<b>Zwycięzcy:</b> czerwony, z miejscem w ścieżce.", "Podpisy: lead wydarzenia i GPSS jako organizator."],
      [["Format", "A4 poziomo"], ["Papier", "kreda mat 250 g"], ["Dane", "imię / zespół z bazy"]])));

  pages.push(page("<em>Specyfikacja</em> druku.",
    `<table style="width:100%;border-collapse:collapse;font:400 12px/1.4 'IBM Plex Mono'">${[["Materiał", "Format", "Druk / nośnik", "Plik"],
      ["Bilet", "203 × 82 mm", "karton 300 g", "pass.html"], ["Plakat", "50 × 70 cm", "kreda mat 170 g", "poster.html"], ["Plakat z planem", "A2", "kreda mat 170 g", "signage.html"],
      ["Roll-up", "85 × 200 cm", "baner PET, kaseta", "rollup.html"], ["Koszulki", "S–XXL", "sitodruk, 4 wzory + 4 załoga", "tshirt.html"], ["Identyfikatory", "90 × 130 mm", "karton 350 g / PVC", "badge.html"],
      ["Smycze", "20 mm", "sublimacja", "badge.html"], ["Naklejki", "60–100 mm", "folia winylowa, wykrojnik", "stickers.html"], ["Kierunkowskazy", "100 × 30 cm", "PCV 3 mm", "signage.html"],
      ["Stanowiska", "A5 namiot", "karton 300 g", "signage.html"], ["Certyfikaty", "A4", "kreda mat 250 g", "diploma.html"], ["Social", "1080 × 1350, 1584 × 396, 1920 × 1005", "PNG", "social.html"]]
      .map((r, i) => `<tr style="border-bottom:1px solid rgba(20,18,16,${i ? .15 : 1});${i ? "" : "font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:10px"}">${r.map((c, j) => `<td style="padding:7px 10px 7px 0;${j === 0 && i ? "font-weight:600" : ""}">${c}</td>`).join("")}</tr>`).join("")}</table>`,
    notes(["Nakłady, papier i drukarnię ustalamy, kiedy będzie budżet i liczba osób.", "Każdy plik źródłowy generuje wersję 1:1 do druku (Chrome: Drukuj → PDF, rozmiar ze strony).", "Czerwień do druku: Pantone 186 C / CMYK 0 100 80 5, do potwierdzenia na próbniku."],
      [["Źródła", "~/reunion-hackathon-a/print"], ["Render", "node render.mjs …"]])));

  document.getElementById("deck").innerHTML = pages.join("");
  Print.block(document.getElementById("cb"), 190);
</script>
</body></html>
