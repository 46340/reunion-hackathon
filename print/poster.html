<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Reunion Hackathon · plakat</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600..900&family=Barlow+Condensed:wght@100;300&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="print.css">
<style>
  @page { size: 50cm 70cm; margin: 0; } @media print { body { background: none; } .sheet { zoom: 1.8898; } }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet { width: 1000px; height: 1400px; }
  .top { position: absolute; left: 56px; right: 56px; top: 44px; display: flex; justify-content: space-between; z-index: 2; }
  .poster-globe { left: -40px; width: 1080px; height: 1080px; top: 470px; }
  #block { position: absolute; left: 0; right: 0; top: 150px; text-align: center; z-index: 2; }
  .kind { position: absolute; left: 0; right: 0; top: 405px; text-align: center; font-size: 64px; letter-spacing: .38em; padding-left: .38em; z-index: 2; }
  .sky { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .sky svg { position: absolute; overflow: visible; }
  .low { position: absolute; left: 56px; right: 56px; bottom: 56px; display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; z-index: 2; }
  .low h2 { font-size: 64px; line-height: 1; max-width: 12ch; text-shadow: 0 2px 18px rgba(80,0,10,.25); }
  .low .mono { margin-top: 18px; }
  .qrbox { display: grid; gap: 10px; justify-items: end; text-align: right; }
  .qrbox .qr { width: 150px; }
</style></head><body>
<div class="sheet grain" id="sheet" data-shot="plakat-50x70">
  <div class="globe poster-globe" data-globe></div>
  <div class="sky" id="sky"></div>
  <div class="top mono"><span>Warszawa · 5–7 lutego 2027 · Edycja 01</span><span>100 uczestników · 48 godzin</span></div>
  <div class="block" id="block">REUNION</div>
  <div class="thin kind">Hackathon</div>
  <div class="low">
    <div><h2 class="serif">Hackathon dla Polaków studiujących <i>za granicą.</i></h2><p class="mono">reunion-hackathon.pl · 5–7 lutego 2027</p></div>
    <div class="qrbox"><div class="qr"><img src="qr.svg" alt="QR do reunion-hackathon.pl"></div><p class="mono" style="font-size:11px;display:flex;align-items:center;gap:10px">Organizator: Global Polish Student Society<img src="../assets/logos/gpss-planet-white.png" alt="" style="width:34px;height:34px"></p></div>
  </div>
</div>
<script src="print.js"></script>
<script>
  Print.block(document.getElementById("block"), 250);
  document.querySelector("[data-globe]").innerHTML = Print.globe({ op: .34, arcs: false });
  // swallows diving home, one large and the rest further away, as on Trepkowski's "Wracajcie" (1946)
  const flock = [[270, 640, 32, 1.1], [560, 590, 36, .45], [455, 770, 28, .6], [720, 700, 40, .36], [630, 845, 34, .3], [380, 915, 26, .25]];
  document.getElementById("sky").innerHTML = `<svg viewBox="0 0 1000 1400" style="left:0;top:0;width:1000px;height:1400px"><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="10" dy="16" stdDeviation="6" flood-color="#5a0612" flood-opacity=".32"/></filter></defs><g filter="url(#sh)">${flock.map(([x, y, a, k]) => Print.swallow(x, y, a, k)).join("")}</g></svg>`;
</script>
</body></html>
